name: Auto-sync Credit Card Extra Amount snapshot
run-name: ${{ github.event_name == 'repository_dispatch' && format('Drive change · {0}', github.event.client_payload.reason) || github.event_name == 'workflow_dispatch' && inputs.reason != '' && format('Drive change · {0}', inputs.reason) || github.event_name == 'schedule' && 'Scheduled backup check' || 'Auto-sync Credit Card Extra Amount snapshot' }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/auto-sync.yml
      - sync-worker/**
      - core.js
  # Immediate path. The Google Apps Script Drive watcher sends this event as
  # soon as a ccol_outlets raw-data file is added, replaced, renamed or edited.
  repository_dispatch:
    types: [drive_credit_card_changed]
  # Backup only. GitHub runs scheduled jobs late (often hours apart), so the
  # instant path is the Drive change trigger (Google Apps Script), which starts
  # this workflow through repository_dispatch within a minute of a file change.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "What changed in Drive (filled in automatically by the Drive change trigger)"
        required: false
        default: ""
        type: string

concurrency:
  group: credit-card-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json

      - name: Install worker dependencies
        working-directory: sync-worker
        run: npm ci

      - name: Read Drive files and publish snapshot
        working-directory: sync-worker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRIGGER_REASON: ${{ github.event.client_payload.reason || inputs.reason || github.event_name }}
        run: node auto-sync.mjs
